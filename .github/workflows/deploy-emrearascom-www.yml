name: Deploy emrearascom-www
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create .env.cf
        run: |
          cat > .env.cf << EOF
          # Cloudflare authentication for the Wrangler CLI (consumed by npm run deploy)
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate development certificate
        run: node scripts/generate_development_certificate.js

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build and prerender
        run: npm run prod

      - name: Deploy to Cloudflare Pages
        # npm run deploy = wrangler pages deploy dist --branch main, targeting the
        # `emrearascom-www` project (wrangler.jsonc `name`) → www.emrearas.com.
        run: npm run deploy

      - name: Generate timestamp
        if: success()
        id: timestamp
        run: echo "value=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: emrearascom-www-dist-${{ steps.timestamp.outputs.value }}
          path: dist/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          rm -f .env.cf
          rm -rf certs dist .wrangler node_modules
