name: Deploy emrearascom-www
on:
  push:
    branches: [main]
    # The worker is a separate deployable with its own workflow; a commit that
    # only touches it must not rebuild and redeploy the site. A commit that
    # touches both still runs this (paths-ignore only skips when every changed
    # file matches).
    paths-ignore:
      - 'workers/**'
      - '.github/workflows/deploy-ai-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Two overlapping runs would each end in `wrangler pages deploy` against the
# same project, and the one that finishes last wins — which may be the older
# build. A second push waits instead; the in-flight deploy always completes.
concurrency:
  group: deploy-emrearascom-www
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create .env.cf
        run: |
          cat > .env.cf << EOF
          # Cloudflare authentication for the Wrangler CLI (consumed by npm run deploy)
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EOF

      - name: Create .env.production
        # Vite inlines these at build time. Both are public client-side config
        # (the worker's URL and the Turnstile *site* key, not its secret), so
        # they are repository variables rather than secrets. The dev endpoint
        # is deliberately absent: a production build never reads it.
        #
        # An unset variable would expand to an empty string and still build —
        # the page would just ship its "agent unavailable" notice — so the
        # values are checked rather than trusted. Cloudflare's test site keys
        # are checked for too: they are non-empty and pass every challenge, so
        # they would deploy a bot gate that stops nobody.
        env:
          VITE_AI_WORKER_PRODUCTION_ENDPOINT: ${{ vars.VITE_AI_WORKER_PRODUCTION_ENDPOINT }}
          VITE_AI_WORKER_TURNSTILE_SITE_KEY: ${{ vars.VITE_AI_WORKER_TURNSTILE_SITE_KEY }}
        run: |
          for name in VITE_AI_WORKER_PRODUCTION_ENDPOINT VITE_AI_WORKER_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set — the /ai page would deploy unconfigured."
              exit 1
            fi
          done
          case "$VITE_AI_WORKER_TURNSTILE_SITE_KEY" in
            [123]x00000000000000000000*)
              echo "::error::VITE_AI_WORKER_TURNSTILE_SITE_KEY is a Cloudflare test key — set the real site key for www.emrearas.com."
              exit 1
              ;;
          esac
          cat > .env.production << EOF
          VITE_AI_WORKER_PRODUCTION_ENDPOINT=$VITE_AI_WORKER_PRODUCTION_ENDPOINT
          VITE_AI_WORKER_TURNSTILE_SITE_KEY=$VITE_AI_WORKER_TURNSTILE_SITE_KEY
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Verify llms.txt is up to date
        # The per-page llms/*.txt files are committed so the build never depends
        # on the generator being installed. This step regenerates them and fails
        # if the result differs — i.e. if MDX changed without regenerating.
        # The hand-written CV text is untouched (home has no MDX source).
        #
        # `git status --porcelain`, not `git diff`: a new page's llms files are
        # untracked, and `git diff` reports nothing at all for a path that was
        # never added — the check would pass while the page ships no llms.txt.
        run: |
          npm --prefix tools/agentic-data-builder ci
          node scripts/generate-llms.js
          drift="$(git status --porcelain -- ':(glob)src/pages/**/llms/*.txt')"
          if [ -n "$drift" ]; then
            echo "::error::llms.txt is out of date — run 'npm run generate-llms' and commit the result."
            echo "$drift"
            exit 1
          fi

      - name: Generate development certificate
        run: node scripts/generate_development_certificate.js

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build and prerender
        run: npm run prod

      - name: Deploy to Cloudflare Pages
        # npm run deploy = wrangler pages deploy dist --branch main, targeting the
        # `emrearascom-www` project (wrangler.jsonc `name`) → www.emrearas.com.
        run: npm run deploy

      - name: Generate timestamp
        if: success()
        id: timestamp
        run: echo "value=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: emrearascom-www-dist-${{ steps.timestamp.outputs.value }}
          path: dist/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          rm -f .env.cf
          rm -rf certs dist .wrangler node_modules tools/agentic-data-builder/node_modules
